services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: employees
      POSTGRES_USER: employees
      POSTGRES_PASSWORD: employees
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U employees"]
      interval: 5s
      retries: 5

  grpc:
    build: .
    command: python grpc_server.py
    environment:
      - DATABASE_URL=postgresql://employees:employees@postgres:5432/employees
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - GRPC_HOST=grpc:50051
    depends_on:
      - grpc

volumes:
  db_data:
