<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Сотрудники</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --bg:           #F1F5F9;
      --surface:      #FFFFFF;
      --border:       #E2E8F0;
      --nav-bg:       #0F172A;
      --accent:       #2563EB;
      --accent-hover: #1D4ED8;
      --text:         #0F172A;
      --text-muted:   #64748B;
      --danger:       #DC2626;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                   "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      min-height: 100vh;
      margin: 0;
    }

    /* ── Navbar ─────────────────────────────────────────── */
    .app-nav {
      background: var(--nav-bg);
      height: 52px;
      display: flex;
      align-items: center;
      padding: 0 24px;
      position: sticky;
      top: 0;
      z-index: 200;
    }

    .app-nav-inner {
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .nav-brand {
      color: #fff;
      font-weight: 600;
      font-size: 15px;
      letter-spacing: -.01em;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-right: 28px;
    }

    .nav-brand-dot {
      width: 24px;
      height: 24px;
      background: var(--accent);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
    }

    .nav-link-item {
      color: #94A3B8;
      font-size: 13.5px;
      font-weight: 500;
      text-decoration: none;
      padding: 6px 10px;
      border-radius: 6px;
      border: none;
      background: none;
      cursor: pointer;
      transition: color .15s, background .15s;
      line-height: 1;
    }

    .nav-link-item:hover,
    .nav-link-item:focus { color: #fff; background: rgba(255,255,255,.09); outline: none; }

    .nav-spacer { flex: 1; }

    .btn-nav-add {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 500;
      border-radius: 6px;
      text-decoration: none;
      transition: background .15s;
      white-space: nowrap;
    }

    .btn-nav-add:hover { background: var(--accent-hover); color: #fff; }

    /* Bootstrap dropdown overrides */
    .dropdown-menu {
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,.1);
      padding: 4px;
      min-width: 160px;
    }

    .dropdown-item {
      font-size: 13.5px;
      padding: 8px 12px;
      border-radius: 6px;
      color: var(--text);
    }

    .dropdown-item:hover { background: var(--bg); color: var(--text); }

    /* ── Flash messages ─────────────────────────────────── */
    .flash {
      border-radius: 8px;
      border-width: 1px;
      border-style: solid;
      padding: 11px 16px;
      font-size: 13.5px;
      font-weight: 500;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .flash.success {
      background: #F0FDF4; border-color: #BBF7D0; color: #166534;
    }

    .flash.error {
      background: #FEF2F2; border-color: #FECACA; color: #991B1B;
    }

    .flash-close {
      background: none; border: none; cursor: pointer;
      color: inherit; opacity: .5; font-size: 15px;
      padding: 0; line-height: 1; flex-shrink: 0;
    }

    .flash-close:hover { opacity: 1; }

    /* ── Page layout ────────────────────────────────────── */
    .app-content {
      max-width: 1200px;
      margin: 0 auto;
      padding: 28px 24px 64px;
    }

    .page-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 20px;
      gap: 12px;
    }

    .page-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
      margin: 0;
      line-height: 1.3;
    }

    .page-meta {
      font-size: 12.5px;
      color: var(--text-muted);
      margin-top: 3px;
    }

    /* ── Cards ──────────────────────────────────────────── */
    .app-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }

    .app-card-header {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .app-card-title {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text);
      margin: 0;
    }

    /* ── Count badge ────────────────────────────────────── */
    .count-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #F1F5F9;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 600;
      min-width: 20px;
      height: 20px;
      border-radius: 5px;
      padding: 0 6px;
    }

    /* ── Table ──────────────────────────────────────────── */
    .app-table {
      width: 100%;
      border-collapse: collapse;
    }

    .app-table thead th {
      background: #F8FAFC;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .06em;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    .app-table thead th a {
      color: var(--text-muted);
      text-decoration: none;
    }

    .app-table thead th a:hover { color: var(--text); }

    .app-table tbody td {
      padding: 13px 16px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
      font-size: 14px;
    }

    .app-table tbody tr:last-child td { border-bottom: none; }
    .app-table tbody tr:hover td { background: #F8FAFC; }

    /* ── Dept badge ─────────────────────────────────────── */
    .dept-tag {
      display: inline-block;
      background: #EFF6FF;
      color: #1D4ED8;
      font-size: 11px;
      font-weight: 500;
      padding: 2px 8px;
      border-radius: 4px;
      white-space: nowrap;
    }

    /* ── Action buttons ─────────────────────────────────── */
    .btn-act {
      font-size: 12.5px;
      font-weight: 500;
      padding: 5px 10px;
      border-radius: 5px;
      text-decoration: none;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text-muted);
      cursor: pointer;
      display: inline-block;
      line-height: 1.4;
      transition: background .12s, color .12s, border-color .12s;
      white-space: nowrap;
    }

    .btn-act:hover { background: var(--surface); color: var(--text); border-color: #CBD5E1; }

    .btn-act.danger:hover  { color: var(--danger); border-color: #FECACA; background: #FEF2F2; }
    .btn-act.history:hover { color: #7C3AED; border-color: #DDD6FE; background: #F5F3FF; }

    /* ── Primary / secondary buttons ───────────────────── */
    .btn-solid {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 8px 18px;
      font-size: 14px;
      font-weight: 500;
      border-radius: 6px;
      text-decoration: none;
      cursor: pointer;
      transition: background .15s;
      display: inline-block;
      line-height: 1.4;
      white-space: nowrap;
    }

    .btn-solid:hover { background: var(--accent-hover); color: #fff; }

    .btn-ghost {
      background: var(--surface);
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 500;
      border-radius: 6px;
      text-decoration: none;
      cursor: pointer;
      transition: background .15s, border-color .15s, color .15s;
      display: inline-block;
      line-height: 1.4;
      white-space: nowrap;
    }

    .btn-ghost:hover { background: var(--bg); color: var(--text); border-color: #CBD5E1; }

    /* ── Form controls ──────────────────────────────────── */
    .form-label {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 6px;
      display: block;
    }

    .form-control, .form-select {
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 14px;
      padding: 8px 12px;
      color: var(--text);
      background: var(--surface);
      width: 100%;
      transition: border-color .15s, box-shadow .15s;
    }

    .form-control:focus, .form-select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37,99,235,.1);
      outline: none;
    }

    .form-control.is-invalid,
    .form-select.is-invalid {
      border-color: var(--danger) !important;
    }

    .form-control.is-invalid:focus,
    .form-select.is-invalid:focus {
      box-shadow: 0 0 0 3px rgba(220,38,38,.1) !important;
    }

    .invalid-feedback {
      color: var(--danger);
      font-size: 12.5px;
      margin-top: 5px;
      display: none;
    }

    .is-invalid ~ .invalid-feedback { display: block; }

    /* ── History badges ─────────────────────────────────── */
    .ev-create {
      background: #DCFCE7; color: #166534;
      font-size: 11px; font-weight: 600;
      padding: 2px 8px; border-radius: 4px;
    }

    .ev-update {
      background: #FEF9C3; color: #854D0E;
      font-size: 11px; font-weight: 600;
      padding: 2px 8px; border-radius: 4px;
    }

    /* ── Empty state ────────────────────────────────────── */
    .empty-state {
      text-align: center;
      padding: 56px 24px;
      color: var(--text-muted);
    }

    .empty-state p { font-size: 14px; margin-bottom: 16px; }
  </style>
</head>
<body>

<nav class="app-nav">
  <div class="app-nav-inner">
    <a class="nav-brand" href="/">
      <span class="nav-brand-dot">E</span>
      Сотрудники
    </a>
    <span class="nav-spacer"></span>
    <div class="dropdown me-1">
      <button class="nav-link-item dropdown-toggle"
              type="button" data-bs-toggle="dropdown" aria-expanded="false">
        Справочники
      </button>
      <ul class="dropdown-menu dropdown-menu-end">
        <li><a class="dropdown-item" href="/positions">Должности</a></li>
        <li><a class="dropdown-item" href="/departments">Отделы</a></li>
      </ul>
    </div>
    <a href="/create" class="btn-nav-add">+ Добавить</a>
  </div>
</nav>

<div class="app-content">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="flash {{ 'success' if category == 'success' else 'error' }}">
        <span>{{ message }}</span>
        <button class="flash-close" onclick="this.parentElement.remove()" aria-label="Закрыть">✕</button>
      </div>
    {% endfor %}
  {% endwith %}

  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  document.querySelectorAll('time[datetime]').forEach(el => {
    const d = new Date(el.getAttribute('datetime'));
    if (!isNaN(d)) el.textContent = d.toLocaleString();
  });
</script>
</body>
</html>
