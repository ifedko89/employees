name: Tests

on:
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      checks: write
      pull-requests: write
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: |
          PG_CTL=$(find /usr/lib/postgresql -name pg_ctl | sort -V | tail -1)
          pytest --postgresql-exec="$PG_CTL" \
            --alluredir=allure-results \
            --junitxml=junit.xml \
            --cov=. \
            --cov-report=xml \
            --cov-report=html:htmlcov \
            --cov-report=term-missing

      - name: Get Allure history from gh-pages
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Generate Allure report with history
        uses: simple-elf/allure-report-action@v1.13
        if: always()
        with:
          allure_results: allure-results
          allure_history: allure-history
          keep_reports: 20
          gh_pages: gh-pages

      - name: Remove .git from allure-history
        if: always()
        run: sudo rm -rf allure-history/.git

      - name: Add coverage heatmap to published report
        if: always()
        run: cp -r htmlcov allure-history/coverage

      - name: Deploy report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history

      - name: Comment PR with report link
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');
            let covPct = '—';
            try {
              const xml = fs.readFileSync('coverage.xml', 'utf8');
              const m = xml.match(/line-rate="([^"]+)"/);
              if (m) covPct = Math.round(parseFloat(m[1]) * 100) + '%';
            } catch (e) {}
            const base = `https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}`;
            const allureUrl  = `${base}/${{ github.run_number }}/`;
            const coverageUrl = `${base}/coverage/`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: [
                '## Результаты тестирования',
                '',
                '| | |',
                '|---|---|',
                `| 📊 Allure Report | [Открыть](${allureUrl}) |`,
                `| 🔥 Coverage Heatmap | [Открыть](${coverageUrl}) |`,
                `| 📈 Покрытие кода | **${covPct}** |`,
              ].join('\n'),
            });

      - uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: junit.xml
