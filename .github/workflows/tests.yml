name: Tests

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      checks: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Write Allure environment info
        run: |
          mkdir -p allure-results
          cat > allure-results/environment.properties << EOF
          Python=$(python --version | cut -d' ' -f2)
          Flask=$(pip show flask | grep ^Version | cut -d' ' -f2)
          DB=PostgreSQL
          EOF

      - name: Run tests
        run: |
          PG_CTL=$(find /usr/lib/postgresql -name pg_ctl | sort -V | tail -1)
          pytest --ignore=tests/test_ui.py \
            --postgresql-exec="$PG_CTL" \
            --alluredir=allure-results \
            --junitxml=junit.xml \
            --cov=. \
            --cov-report=xml \
            --cov-report=json \
            --cov-report=term-missing

      - name: Generate coverage heatmap
        if: always()
        run: python scripts/gen_coverage_heatmap.py

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

      - name: Upload coverage heatmap
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-heatmap
          path: coverage_heatmap/

      - uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: junit.xml

  ui-test:
    runs-on: ubuntu-latest
    needs: test

    permissions:
      checks: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Write Allure environment info
        run: |
          mkdir -p allure-results-ui
          cat > allure-results-ui/environment.properties << EOF
          Python=$(python --version | cut -d' ' -f2)
          Flask=$(pip show flask | grep ^Version | cut -d' ' -f2)
          Browser=Chromium
          DB=PostgreSQL
          EOF

      - name: Run UI tests
        run: |
          PG_CTL=$(find /usr/lib/postgresql -name pg_ctl | sort -V | tail -1)
          pytest tests/test_ui.py \
            --postgresql-exec="$PG_CTL" \
            -n auto \
            --reruns 2 --reruns-delay 1 \
            --alluredir=allure-results-ui \
            --junitxml=junit-ui.xml

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-ui
          path: allure-results-ui/

      - uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: junit-ui.xml
          check_name: UI Test Results

  deploy:
    runs-on: ubuntu-latest
    needs: [test, ui-test]
    if: always()

    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Download Allure results (unit/route tests)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: allure-results
          path: allure-results/

      - name: Download Allure results (UI tests)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: allure-results-ui
          path: allure-results/

      - name: Download coverage XML
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: coverage-xml
          path: .

      - name: Download coverage heatmap
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: coverage-heatmap
          path: coverage_heatmap/

      - name: Get Allure history from gh-pages
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Generate Allure report with history
        uses: simple-elf/allure-report-action@v1.13
        if: always()
        with:
          allure_results: allure-results
          allure_history: allure-history
          keep_reports: 20
          gh_pages: gh-pages

      - name: Remove .git from allure-history
        if: always()
        run: sudo rm -rf allure-history/.git

      - name: Deploy Allure report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
          keep_files: true

      - name: Deploy coverage heatmap to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: coverage_heatmap
          destination_dir: coverage
          keep_files: true

      - name: Comment PR with report link
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let covPct = '—';
            try {
              const xml = fs.readFileSync('coverage.xml', 'utf8');
              const m = xml.match(/line-rate="([^"]+)"/);
              if (m) covPct = Math.round(parseFloat(m[1]) * 100) + '%';
            } catch (e) {}
            const base = `https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}`;
            const allureUrl  = `${base}/${{ github.run_number }}/`;
            const coverageUrl = `${base}/coverage/`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: [
                '## Результаты тестирования',
                '',
                '| | |',
                '|---|---|',
                `| 📊 Allure Report | [Открыть](${allureUrl}) |`,
                `| 🔥 Coverage Heatmap | [Открыть](${coverageUrl}) |`,
                `| 📈 Покрытие кода | **${covPct}** |`,
              ].join('\n'),
            });
